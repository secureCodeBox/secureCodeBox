{{- if eq (include "operator.garageEnabled" .) "true" }}
{{- if not .Values.garage.auth.existingSecret }}
{{- $garageSecretName := printf "%s-garage" (include "operator.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $garageSecretName }}
{{- $accessKey := .Values.garage.auth.accessKey }}
{{- if not $accessKey }}
  {{- if $existingSecret }}
    {{- $accessKey = index $existingSecret.data "access-key" | b64dec }}
  {{- else }}
    {{- $accessKey = printf "GK%s" (randAlphaNum 30) }}
  {{- end }}
{{- end }}
{{- $secretKey := .Values.garage.auth.secretKey }}
{{- if not $secretKey }}
  {{- if $existingSecret }}
    {{- $secretKey = index $existingSecret.data "secret-key" | b64dec }}
  {{- else }}
    {{- $secretKey = randAlphaNum 40 }}
  {{- end }}
{{- end }}
{{- $rpcSecret := .Values.garage.auth.rpcSecret }}
{{- if not $rpcSecret }}
  {{- if $existingSecret }}
    {{- $rpcSecret = index $existingSecret.data "rpc-secret" | b64dec }}
  {{- else }}
    {{- /* Garage requires exactly 32 bytes of random hex here, so hash a random seed rather than using randAlphaNum directly */}}
    {{- $rpcSecret = randAlphaNum 40 | sha256sum }}
  {{- end }}
{{- end }}
{{- $adminToken := .Values.garage.auth.adminToken }}
{{- if not $adminToken }}
  {{- if $existingSecret }}
    {{- $adminToken = index $existingSecret.data "admin-token" | b64dec }}
  {{- else }}
    {{- $adminToken = randAlphaNum 64 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $garageSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
type: Opaque
stringData:
  access-key: {{ $accessKey | quote }}
  secret-key: {{ $secretKey | quote }}
  rpc-secret: {{ $rpcSecret | quote }}
  admin-token: {{ $adminToken | quote }}
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/data"
    db_engine = "lmdb"

    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret = "{{ $rpcSecret }}"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "{{ $adminToken }}"
{{- end }}
{{- end }}
