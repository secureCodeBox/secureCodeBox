suite: Full Snapshot
templates:
  - NOTES.txt
  - rbac/*.yaml
  - manager/*.yaml
  - garage/*.yaml
tests:
  - it: matches the snapshot
    chart:
      version: 0.0.0
      appVersion: 0.0.0
    set:
      imagePullSecrets: [{name: foo}]
      customCACertificate.existingCertificate: foo
      serviceaccount: {create: true, annotations: {foo: bar}, name: foo}
      podSecurityContext: {fsGroup: 1234}
      garage:
        enabled: true
        auth:
          accessKey: testaccesskey
          secretKey: testsecretkey
          rpcSecret: testrpcsecret
          adminToken: testadmintoken
    asserts:
      - matchSnapshot: {}
  - it: properly-renders-the-service-monitor-when-enabled
    chart:
      version: 0.0.0
      appVersion: 0.0.0
    set:
      imagePullSecrets: [{name: foo}]
      customCACertificate.existingCertificate: foo
      serviceaccount: {create: true, annotations: {foo: bar}, name: foo}
      podSecurityContext: {fsGroup: 1234}
      metrics:
        serviceMonitor:
          enabled: true
      garage:
        enabled: true
        auth:
          accessKey: testaccesskey
          secretKey: testsecretkey
          rpcSecret: testrpcsecret
          adminToken: testadmintoken
    asserts:
      - matchSnapshot: {}
  - it: renders garage resources when garage is enabled
    templates:
      - garage/secret.yaml
      - garage/service.yaml
      - garage/statefulset.yaml
    chart:
      version: 0.0.0
      appVersion: 0.0.0
    set:
      garage:
        enabled: true
        auth:
          accessKey: testaccesskey
          secretKey: testsecretkey
    asserts:
      - hasDocuments:
          count: 1
  - it: does not render garage resources when garage is disabled
    templates:
      - garage/secret.yaml
      - garage/service.yaml
      - garage/statefulset.yaml
    chart:
      version: 0.0.0
      appVersion: 0.0.0
    set:
      garage:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: configures manager deployment for garage
    templates:
      - manager/manager.yaml
    chart:
      version: 0.0.0
      appVersion: 0.0.0
    set:
      garage:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="S3_USE_SSL")].value
          value: "false"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="S3_ENDPOINT")].value
          value: "RELEASE-NAME-garage.NAMESPACE.svc.cluster.local"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="S3_PORT")].value
          value: "3900"
  - it: allows overriding the cluster domain used for the garage endpoint
    templates:
      - manager/manager.yaml
    chart:
      version: 0.0.0
      appVersion: 0.0.0
    set:
      garage:
        enabled: true
      clusterDomain: custom.local
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="S3_ENDPOINT")].value
          value: "RELEASE-NAME-garage.NAMESPACE.svc.custom.local"
  - it: configures manager deployment for external s3
    templates:
      - manager/manager.yaml
    chart:
      version: 0.0.0
      appVersion: 0.0.0
    set:
      garage:
        enabled: false
      s3:
        enabled: true
        endpoint: "s3.amazonaws.com"
        bucket: "my-bucket"
        tls:
          enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="S3_USE_SSL")].value
          value: "true"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="S3_ENDPOINT")].value
          value: "s3.amazonaws.com"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="S3_BUCKET")].value
          value: "my-bucket"
  - it: renders garage secret with custom credentials
    templates:
      - garage/secret.yaml
    chart:
      version: 0.0.0
      appVersion: 0.0.0
    set:
      garage:
        enabled: true
        auth:
          accessKey: customaccesskey
          secretKey: customsecretkey
    asserts:
      - equal:
          path: stringData.access-key
          value: "customaccesskey"
      - equal:
          path: stringData.secret-key
          value: "customsecretkey"
  - it: omits storageClassName when not specified to use default
    templates:
      - garage/statefulset.yaml
    chart:
      version: 0.0.0
      appVersion: 0.0.0
    set:
      garage:
        enabled: true
        persistence:
          storageClass: ""
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
  - it: includes storageClassName when specified
    templates:
      - garage/statefulset.yaml
    chart:
      version: 0.0.0
      appVersion: 0.0.0
    set:
      garage:
        enabled: true
        persistence:
          storageClass: "fast-ssd"
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: "fast-ssd"
